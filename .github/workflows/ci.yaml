name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

# Cancel in-progress runs on the same branch when a new push arrives.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Graceful failover: an unreachable sccache backend must never fail a build.
  SCCACHE_IGNORE_SERVER_IO_ERROR: "1"
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# Default to read-only — every job in this file is read-only relative to the repo
# (fmt, clippy, test, no-openssl). Without this block, push events would inherit
# the repo default (often `contents: write`).
permissions:
  contents: read

jobs:
  # ── 1. Format ──────────────────────────────────────────────────────────────
  fmt:
    # Explicit ceiling: with a cold cache these jobs run long (observed up to
    # 2h01m for clippy while sccache was failing); the 360m GitHub default is
    # too loose to catch a hang.
    timeout-minutes: 15
    name: Format
    # `firethorn` is the org-wide ARC runner set (kubernetes/github-runner/
    # feralfantasies-org-values.yaml: runnerScaleSetName "firethorn",
    # githubConfigUrl = the feralfantasies ORG, so any repo in the org can use
    # it). The old `arc-runner-dm-mcp` label belonged to a per-repo scale set
    # that is not deployed — verified 2026-11-06: `kubectl get
    # autoscalingrunnerset -A` returns exactly one set, arc-runners/firethorn,
    # and `gh api orgs/feralfantasies/actions/runners` returns an empty list.
    # Nothing advertised the old label, so these jobs could never be picked up.
    # Same label kubernetes, larderly, ollama_monitor and price-action use.
    runs-on: firethorn
    steps:
      # rustfmt is a pure Rust binary — no C toolchain needed.
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3  # v6.0.0

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable
        with:
          components: rustfmt

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

  # ── 2. Clippy ─────────────────────────────────────────────────────────────
  clippy:
    # Explicit ceiling: with a cold cache these jobs run long (observed up to
    # 2h01m for clippy while sccache was failing); the 360m GitHub default is
    # too loose to catch a hang.
    timeout-minutes: 150
    name: Clippy
    runs-on: firethorn
    steps:
      - name: Install system dependencies
        run: |
          for i in 1 2 3; do
            sudo apt-get update -qq && sudo apt-get install -y build-essential pkg-config && break
            echo "apt-get attempt $i failed; retrying in 10 s..."
            sleep 10
          done

      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3  # v6.0.0

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable
        with:
          components: clippy

      - name: Fail over to plain rustc if the sccache backend is unhealthy
        # The firethorn runner pod injects RUSTC_WRAPPER=sccache into every job,
        # and sccache FAILS THE BUILD by default when it cannot reach its
        # server. Observed here 2026-11-06:
        #   sccache: error: Timed out waiting for server startup.
        #            Maybe the remote service is unreachable?
        #   error: process didn't exit successfully: `sccache .../rustc -vV`
        # Probe once; on failure clear RUSTC_WRAPPER via $GITHUB_ENV so later
        # steps compile uncached instead of failing the job. sccache's own
        # startup wait is not configurable (upstream server.rs exposes only
        # IDLE_TIMEOUT, MAX_FRAME_LENGTH, NO_CACHE, RECACHE, SERVER_PORT and
        # STARTUP_NOTIFY), so failing over is the only available lever.
        run: |
          if [ -z "${RUSTC_WRAPPER:-}" ]; then
            echo "RUSTC_WRAPPER not set - nothing to disable"; exit 0
          fi
          if timeout 240 "$RUSTC_WRAPPER" --show-stats > /tmp/sccache-probe.log 2>&1; then
            echo "sccache healthy - keeping the compile cache"
            tail -n 4 /tmp/sccache-probe.log || true
          else
            echo "::warning::sccache backend unreachable - disabling it for this job"
            tail -n 6 /tmp/sccache-probe.log || true
            echo "RUSTC_WRAPPER=" >> "$GITHUB_ENV"
          fi
          # A probe alone is not sufficient: on 2026-11-07 (PR #59) this probe
          # passed 2 s before `cargo clippy` hit the same startup timeout. The
          # compiling step below therefore also runs via
          # .github/scripts/sccache-fallback.sh, which retries once, uncached,
          # after a sccache error.
      - uses: Swatinem/rust-cache@bc2d2e71bd35c5549942babaa51a89c586b981d1  # v2.8.1

      - name: cargo clippy — deny all warnings
        run: bash .github/scripts/sccache-fallback.sh cargo clippy --all-targets -- -D warnings

  # ── 3. Tests ──────────────────────────────────────────────────────────────
  # Unit tests + integration tests. tests/*.rs spawn the compiled binary and
  # drive it through real MCP protocol. No external services — SQLite is
  # embedded, and the MCP has no auth/persistence dependencies that outlive
  # the process.
  test:
    # Explicit ceiling: with a cold cache these jobs run long (observed up to
    # 2h01m for clippy while sccache was failing); the 360m GitHub default is
    # too loose to catch a hang.
    timeout-minutes: 120
    name: Tests
    runs-on: firethorn
    needs: [fmt, clippy]
    steps:
      - name: Install system dependencies
        run: |
          for i in 1 2 3; do
            sudo apt-get update -qq && sudo apt-get install -y build-essential pkg-config && break
            echo "apt-get attempt $i failed; retrying in 10 s..."
            sleep 10
          done

      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3  # v6.0.0

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable

      - name: Fail over to plain rustc if the sccache backend is unhealthy
        # The firethorn runner pod injects RUSTC_WRAPPER=sccache into every job,
        # and sccache FAILS THE BUILD by default when it cannot reach its
        # server. Observed here 2026-11-06:
        #   sccache: error: Timed out waiting for server startup.
        #            Maybe the remote service is unreachable?
        #   error: process didn't exit successfully: `sccache .../rustc -vV`
        # Probe once; on failure clear RUSTC_WRAPPER via $GITHUB_ENV so later
        # steps compile uncached instead of failing the job. sccache's own
        # startup wait is not configurable (upstream server.rs exposes only
        # IDLE_TIMEOUT, MAX_FRAME_LENGTH, NO_CACHE, RECACHE, SERVER_PORT and
        # STARTUP_NOTIFY), so failing over is the only available lever.
        run: |
          if [ -z "${RUSTC_WRAPPER:-}" ]; then
            echo "RUSTC_WRAPPER not set - nothing to disable"; exit 0
          fi
          if timeout 240 "$RUSTC_WRAPPER" --show-stats > /tmp/sccache-probe.log 2>&1; then
            echo "sccache healthy - keeping the compile cache"
            tail -n 4 /tmp/sccache-probe.log || true
          else
            echo "::warning::sccache backend unreachable - disabling it for this job"
            tail -n 6 /tmp/sccache-probe.log || true
            echo "RUSTC_WRAPPER=" >> "$GITHUB_ENV"
          fi
          # A probe alone is not sufficient: on 2026-11-07 (PR #59) this probe
          # passed 2 s before `cargo clippy` hit the same startup timeout. The
          # compiling steps below therefore also run via
          # .github/scripts/sccache-fallback.sh, which retries once, uncached,
          # after a sccache error.
      - uses: Swatinem/rust-cache@bc2d2e71bd35c5549942babaa51a89c586b981d1  # v2.8.1

      - name: cargo build (release — verifies the release profile compiles clean)
        run: bash .github/scripts/sccache-fallback.sh cargo build --release

      - name: cargo test
        run: bash .github/scripts/sccache-fallback.sh cargo test

  # ── 4. No-OpenSSL audit ───────────────────────────────────────────────────
  # Project rule: all TLS must go through rustls. OpenSSL breaks the `scratch`
  # container build. If a new or updated dep drags openssl / openssl-sys /
  # native-tls into the tree, fail the build so the regression is caught
  # before merge.
  no-openssl:
    # Explicit ceiling: with a cold cache these jobs run long (observed up to
    # 2h01m for clippy while sccache was failing); the 360m GitHub default is
    # too loose to catch a hang.
    timeout-minutes: 90
    name: No OpenSSL
    runs-on: firethorn
    steps:
      - name: Install system dependencies
        run: |
          for i in 1 2 3; do
            sudo apt-get update -qq && sudo apt-get install -y build-essential pkg-config && break
            echo "apt-get attempt $i failed; retrying in 10 s..."
            sleep 10
          done

      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3  # v6.0.0

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable

      - name: Fail over to plain rustc if the sccache backend is unhealthy
        # The firethorn runner pod injects RUSTC_WRAPPER=sccache into every job,
        # and sccache FAILS THE BUILD by default when it cannot reach its
        # server. Observed here 2026-11-06:
        #   sccache: error: Timed out waiting for server startup.
        #            Maybe the remote service is unreachable?
        #   error: process didn't exit successfully: `sccache .../rustc -vV`
        # Probe once; on failure clear RUSTC_WRAPPER via $GITHUB_ENV so later
        # steps compile uncached instead of failing the job. sccache's own
        # startup wait is not configurable (upstream server.rs exposes only
        # IDLE_TIMEOUT, MAX_FRAME_LENGTH, NO_CACHE, RECACHE, SERVER_PORT and
        # STARTUP_NOTIFY), so failing over is the only available lever.
        run: |
          if [ -z "${RUSTC_WRAPPER:-}" ]; then
            echo "RUSTC_WRAPPER not set - nothing to disable"; exit 0
          fi
          if timeout 240 "$RUSTC_WRAPPER" --show-stats > /tmp/sccache-probe.log 2>&1; then
            echo "sccache healthy - keeping the compile cache"
            tail -n 4 /tmp/sccache-probe.log || true
          else
            echo "::warning::sccache backend unreachable - disabling it for this job"
            tail -n 6 /tmp/sccache-probe.log || true
            echo "RUSTC_WRAPPER=" >> "$GITHUB_ENV"
          fi
          # (This job only runs `cargo tree` — no compilation — so the probe is
          # informational here; the sccache-fallback retry applies to the
          # compiling jobs above.)
      - uses: Swatinem/rust-cache@bc2d2e71bd35c5549942babaa51a89c586b981d1  # v2.8.1

      - name: Verify openssl is not in the dependency tree
        run: |
          for crate in openssl openssl-sys native-tls; do
            if cargo tree -i "$crate" >/dev/null 2>&1; then
              echo "ERROR: $crate is in the dependency tree — rustls only" >&2
              cargo tree -i "$crate"
              exit 1
            fi
          done
          echo "OK: no openssl/openssl-sys/native-tls in the tree"
